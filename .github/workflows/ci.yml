name: ci

# scripts/validate.sh on GitHub's Linux runner: the unit checks, -race and a
# fuzz smoke run in one job; the live conformance against straum-broker and
# straum-fake-server built from the Straum commit in CONTRACT in another.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/validate.sh quick
      - run: go run "$(sed -n 's/^GOVULNCHECK="\(.*\)"$/\1/p' scripts/validate.sh)" ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: |
          for target in FuzzDecodeRequest FuzzDecodeResponse FuzzFrame; do
            go test ./wire/ -run '^$' -fuzz "^${target}\$" -fuzztime 10s
          done

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: contract
        run: echo "commit=$(sed -n 's/^commit: //p' CONTRACT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: straum-io/straum
          ref: ${{ steps.contract.outputs.commit }}
          path: straum
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: straum
      - run: scripts/sync-conformance.sh --check straum
      - run: scripts/live.sh "$PWD/straum" -race
